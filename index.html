<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b0709">
<title>Check-In Board · Hotties</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0709'/%3E%3Cpath d='M8 8l16 16M24 8L8 24' stroke='%23ff3ea5' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Exxxotica Hotties palette, sampled from the brand posters */
  :root {
    --bg: #0b0709;
    --bg-2: #12060e;
    --panel: #140a11;
    --panel-2: #1c0e18;
    --ink: #f1ecf0;
    --muted: #a8939f;
    --line: rgba(216, 65, 146, .28);
    --pink: #d84192;       /* stripe + headline pink */
    --hot: #ff3ea5;        /* poster border / glow pink */
    --deep: #c0126f;       /* QR eye magenta */
    --violet: #7b45db;     /* QR card gradient */
    --cyan: #00ffff;
    --magenta: #ff00ff;
    --accent: #ff3ea5;
    --display: "Archivo Black", "Arial Black", Impact, sans-serif;
    --mono: "Space Mono", ui-monospace, Menlo, monospace;
    --body: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    color: var(--ink); font: 15px/1.45 var(--body); -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(900px 520px at 50% -120px, rgba(216, 65, 146, .30), transparent 70%),
      radial-gradient(700px 500px at 100% 100%, rgba(123, 69, 219, .16), transparent 70%),
      radial-gradient(rgba(216, 65, 146, .16) 1px, transparent 1.4px) 0 0 / 22px 22px,
      var(--bg);
    background-attachment: fixed;
  }
  button, input { font: inherit; color: inherit; }
  .mono { font-family: var(--mono); }

  /* ---------- brand strips ---------- */
  .strip {
    background: var(--pink); color: #0b0709; overflow: hidden; white-space: nowrap;
    font: 15px/1 var(--display); letter-spacing: .24em; padding: 10px 0; user-select: none;
  }
  .strip.thin { font-size: 11px; padding: 6px 0; letter-spacing: .3em; }
  .strip .run { display: inline-block; padding-left: 0; animation: run 38s linear infinite; }
  .strip .x { font-family: var(--body); font-weight: 300; margin: 0 .9em; letter-spacing: 0; }
  @keyframes run { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .strip .run { animation: none; } }

  /* ---------- lock screen ---------- */
  #lock { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  .lock-main { flex: 1; display: grid; place-items: center; padding: 28px 16px; }
  .lock-card { width: 100%; max-width: 400px; text-align: center; }
  .logo-box {
    position: relative; margin: 0 auto 26px; padding: 18px 20px; max-width: 360px;
    background: #0b0709; border: 3px solid #fff;
    box-shadow: -7px -7px 0 0 var(--cyan), 7px 7px 0 0 var(--magenta);
  }
  .logo-box img { display: block; width: 100%; height: auto; mix-blend-mode: screen; }
  .lock-card h1 {
    font: 44px/0.95 var(--display); margin: 0; letter-spacing: .01em; text-transform: uppercase;
  }
  .lock-card h1 span { color: var(--pink); }
  .lock-sub { font: 12px/1.6 var(--mono); letter-spacing: .32em; color: var(--hot); text-transform: uppercase; margin: 12px 0 22px; }
  .tag {
    display: inline-block; background: var(--hot); color: #0b0709; font: 700 11px/1 var(--mono);
    letter-spacing: .22em; padding: 7px 12px; text-transform: uppercase; margin-bottom: -1px; position: relative; z-index: 1;
  }
  .lock-panel { background: rgba(20, 10, 17, .92); border: 2px solid var(--hot); padding: 22px 20px 18px; text-align: left; }
  .lock-panel input[type=password] {
    width: 100%; padding: 13px 14px; border: 1px solid var(--line); background: var(--bg);
    outline: none; font: 16px var(--mono); letter-spacing: .04em; border-radius: 0;
  }
  .lock-panel input[type=password]::placeholder { color: var(--muted); letter-spacing: .2em; text-transform: uppercase; font-size: 13px; }
  .lock-panel input[type=password]:focus { border-color: var(--hot); box-shadow: 0 0 0 3px rgba(255, 62, 165, .25); }
  .remember { display: flex; align-items: center; gap: 9px; margin: 14px 0 18px; font-size: 13px; color: var(--muted); }
  .remember input { accent-color: var(--hot); width: 16px; height: 16px; }
  .btn {
    display: block; width: 100%; border: 0; cursor: pointer; background: var(--pink); color: #0b0709;
    font: 17px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; padding: 15px 12px;
    transform: skewX(-8deg); transition: background .15s, box-shadow .15s;
  }
  .btn > span { display: inline-block; transform: skewX(8deg); font-style: italic; }
  .btn:hover { background: var(--hot); box-shadow: 0 0 24px rgba(255, 62, 165, .45); }
  .btn[disabled] { opacity: .6; cursor: progress; }
  .err { color: var(--hot); font: 13px var(--mono); min-height: 20px; margin-top: 12px; text-align: center; }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; max-width: 1400px; width: 100%; margin: 0 auto;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); font: 12px var(--mono); letter-spacing: .32em; text-transform: uppercase; }
  .foot b { color: var(--hot); font-weight: 400; }
  .foot-link { color: var(--muted); text-decoration: none; letter-spacing: .2em; }
  .foot-link:hover { color: var(--hot); }
  @media (max-width: 560px) { .foot { flex-wrap: wrap; } .foot-link { order: 3; width: 100%; } }

  /* ---------- dashboard ---------- */
  #app { display: none; min-height: 100vh; flex-direction: column; }
  #app.on { display: flex; }
  header {
    position: sticky; top: 0; z-index: 500;
    background: rgba(11, 7, 9, .86); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .head-in { padding: 12px 16px 0; padding-top: max(12px, env(safe-area-inset-top)); }
  .bar { display: flex; align-items: center; gap: 12px; max-width: 1400px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand img { height: 34px; width: auto; mix-blend-mode: screen; flex: none; }
  .brand h2 { font: 700 11px/1.2 var(--mono); letter-spacing: .28em; text-transform: uppercase; color: var(--hot); margin: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 1px solid var(--line); padding-left: 12px; }
  .live { display: inline-flex; align-items: center; gap: 7px; font: 11px var(--mono); letter-spacing: .2em; color: var(--muted); white-space: nowrap; text-transform: uppercase; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 255, 255, .6); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .spacer { flex: 1; }
  .icon-btn {
    border: 1px solid var(--hot); background: transparent; color: var(--ink); padding: 8px 11px; cursor: pointer;
    font: 700 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; white-space: nowrap;
  }
  .icon-btn:hover { background: var(--hot); color: #0b0709; }
  .tabs { display: flex; gap: 2px; max-width: 1400px; margin: 10px auto 0; overflow-x: auto; scrollbar-width: none; }
  .tab {
    border: 0; background: none; padding: 10px 12px 11px; cursor: pointer; color: var(--muted); white-space: nowrap;
    font: 700 12px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; border-bottom: 3px solid transparent;
  }
  .tab[aria-selected=true] { color: var(--ink); border-color: var(--hot); }
  main { flex: 1; width: 100%; max-width: 1400px; margin: 0 auto; padding: 18px 16px; }
  .view { display: none; }
  .view.on { display: block; }

  /* cards: dark panel with pink corner brackets, like the QR frame */
  .frame { position: relative; background: var(--panel); border: 1px solid var(--line); }
  .frame::before, .frame::after { content: ""; position: absolute; width: 18px; height: 18px; pointer-events: none; z-index: 2; }
  .frame::before { top: -3px; left: -3px; border-top: 3px solid var(--hot); border-left: 3px solid var(--hot); }
  .frame::after { bottom: -3px; right: -3px; border-bottom: 3px solid var(--hot); border-right: 3px solid var(--hot); }
  .frame-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line);
    font: 700 12px/1.2 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--hot); }
  .frame iframe {
    display: block; width: 100%; border: 0; background: #fff;
    border-top: 3px solid; border-image: linear-gradient(90deg, var(--hot), var(--violet)) 1;
  }
  #view-log iframe, #view-checkin iframe { height: calc(100vh - 200px); min-height: 520px; }
  /* dark tint over Clappia frames: white -> near-black, hues kept */
  .frame.tinted iframe { filter: invert(.92) hue-rotate(180deg) saturate(1.15); background: #fff; }
  .head-r { display: inline-flex; align-items: center; gap: 12px; }
  .theme-btn {
    border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer;
    font: 700 10px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; padding: 6px 9px;
  }
  .theme-btn:hover { border-color: var(--hot); color: var(--ink); }
  .grid { display: grid; gap: 18px; grid-template-columns: 1fr; }
  @media (min-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } .grid .wide { grid-column: 1 / -1; } }
  .grid iframe { height: 420px; }
  .grid .wide iframe { height: calc(100vh - 200px); min-height: 520px; }
  .empty { padding: 48px 16px; text-align: center; color: var(--muted); font: 13px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
  .stamp { font: 400 10px var(--mono); letter-spacing: .12em; color: var(--muted); white-space: nowrap; }
  @media (max-width: 560px) {
    .live span.lbl, .brand h2 { display: none; }
    .brand img { height: 30px; }
  }

  /* ---------- analytics ---------- */
  .a-body { padding: 16px; }
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 700px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
  .kpi { background: var(--bg); border: 1px solid var(--line); padding: 14px 14px 12px; }
  .kpi:first-child { background: var(--pink); border-color: var(--pink); color: #0b0709; }
  .kpi:first-child .kpi-l { color: #0b0709; }
  .kpi-n { font: 38px/1 var(--display); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .kpi-l { font: 700 10px/1.3 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--hot); margin-top: 8px; }
  .last { margin-top: 14px; font-size: 14px; }
  .last b { color: var(--hot); }
  .muted { color: var(--muted); }
  .list { list-style: none; margin: 0; padding: 0; max-height: 280px; overflow: auto; }
  .list li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 15px; font-weight: 500; }
  .list li span:last-child { font: 13px var(--mono); }
  .list li:last-child { border-bottom: 0; }
  .a-empty { color: var(--muted); font: 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; padding: 22px 4px; text-align: center; }
  .chart { width: 100%; height: auto; display: block; }
  .chart .bar { fill: url(#barGrad); opacity: .55; }
  .chart .bar.today { fill: var(--hot); opacity: 1; filter: drop-shadow(0 0 6px rgba(255, 62, 165, .6)); }
  .chart .bar-n { font: 700 11px var(--mono); fill: var(--ink); text-anchor: middle; }
  .chart .bar-l { font: 10px var(--mono); fill: var(--muted); text-anchor: middle; }
  #a-map { height: 380px; z-index: 0; background: var(--bg-2); }
  .leaflet-container { font-family: var(--body); background: #0d0b0d; }
  /* darken OpenStreetMap's light tiles: invert, keep hues, then tint toward the brand */
  #a-map .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.6); }
  .leaflet-control-attribution { background: rgba(11, 7, 9, .75) !important; color: var(--muted) !important; }
  .leaflet-control-attribution a { color: var(--hot) !important; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel-2); color: var(--ink); border: 1px solid var(--hot); border-radius: 0; }
  .leaflet-popup-content b { color: var(--hot); }
  .hbars { max-height: 440px; overflow-y: auto; overscroll-behavior: contain; padding-right: 6px; margin-right: -6px;
    scrollbar-width: thin; scrollbar-color: var(--hot) transparent;
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent); padding-bottom: 20px; }
  .hbars::-webkit-scrollbar { width: 4px; } .hbars::-webkit-scrollbar-thumb { background: var(--hot); }
  .dupes { margin-top: 14px; padding: 12px 14px; border: 1px dashed var(--hot); font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  .dupes b { width: 100%; font: 700 10px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--hot); }
  .dupes i { color: var(--muted); font-style: normal; }
  .fix-hint { margin: 12px 0 0; font-size: 13px; color: var(--muted); }
  .fix-hint b { color: var(--ink); }
  .hbar { display: grid; grid-template-columns: minmax(70px, 170px) 1fr 32px; gap: 12px; align-items: center; padding: 6px 0; font-size: 14px; font-weight: 500; }
  .hbar-l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar-l small { display: block; font: 10px/1.4 var(--mono); letter-spacing: .06em; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .hbar-t { height: 10px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
  .hbar-f { display: block; height: 100%; background: linear-gradient(90deg, var(--hot), var(--violet)); }
  .hbar-n { text-align: right; font: 700 13px var(--mono); color: var(--ink); }
</style>
</head>
<body>

<section id="lock">
  <div class="strip" aria-hidden="true"><span class="run" data-word="HOTTIES"></span></div>
  <div class="lock-main">
    <form class="lock-card" id="lockForm" autocomplete="on">
      <div class="logo-box"><img src="assets/logo.jpg" alt="Exxxotica Hotties" width="1000" height="297"></div>
      <h1>Staff <span>only.</span></h1>
      <div class="lock-sub">Check-ins &amp; analytics</div>
      <div class="tag">Management access</div>
      <div class="lock-panel">
        <input type="text" name="username" value="staff" autocomplete="username" hidden>
        <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required autofocus aria-label="Password">
        <label class="remember"><input type="checkbox" id="remember"> Keep me signed in on this device</label>
        <button class="btn" id="go" type="submit"><span id="goLbl">Unlock &rarr;</span></button>
        <div class="err" id="err" role="alert"></div>
      </div>
    </form>
  </div>
  <div class="foot"><span>Welcome to the club</span><b>18+</b></div>
</section>

<div id="app">
  <header>
    <div class="strip thin" aria-hidden="true"><span class="run" data-word="HOTTIES"></span></div>
    <div class="head-in">
      <div class="bar">
        <div class="brand"><img src="assets/logo.jpg" alt="Exxxotica Hotties" width="114" height="34"><h2 id="title">Check-In Board</h2></div>
        <span class="live" title="Updates as new check-ins arrive"><span class="dot"></span><span class="lbl">Live</span></span>
        <div class="spacer"></div>
        <button class="icon-btn" id="refresh" type="button">Refresh</button>
        <button class="icon-btn" id="logout" type="button">Lock</button>
      </div>
      <nav class="tabs" role="tablist">
        <button class="tab" role="tab" data-view="log" aria-selected="true">Check-in log</button>
        <button class="tab" role="tab" data-view="analytics" aria-selected="false">Analytics</button>
        <button class="tab" role="tab" data-view="checkin" aria-selected="false" id="tab-checkin" hidden>Check in</button>
      </nav>
    </div>
  </header>
  <main>
    <section class="view on" id="view-log"></section>
    <section class="view" id="view-analytics"><div class="grid" id="charts"></div></section>
    <section class="view" id="view-checkin"></section>
  </main>
  <div class="foot"><span>Welcome to the club</span><a class="foot-link" href="webhook.html">Discord alerts &rarr;</a><b>18+</b></div>
</div>

<!-- shared gradient for chart bars -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3ea5"/><stop offset="1" stop-color="#7b45db"/></linearGradient>
</defs></svg>

<script src="payload.js?v=98524fac"></script>
<script src="analytics.js?v=98524fac"></script>
<script>
(() => {
  const KEY = 'checkin-board-key';
  // Brand marquee: HOTTIES × HOTTIES × … (two copies so the loop is seamless)
  document.querySelectorAll('.strip .run').forEach(el => {
    const unit = `${el.dataset.word}<span class="x">&times;</span>`;
    el.innerHTML = unit.repeat(16) + unit.repeat(16);
  });
  const $ = (id) => document.getElementById(id);
  const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const enc = new TextEncoder(), dec = new TextDecoder();
  let refreshTimer = null;

  const store = {
    get() { try { return localStorage.getItem(KEY) || sessionStorage.getItem(KEY); } catch { return null; } },
    set(v, keep) { try { (keep ? localStorage : sessionStorage).setItem(KEY, v); } catch {} },
    clear() { try { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); } catch {} }
  };

  // Curly quotes (iPhone smart punctuation) count the same as straight ones
  const normalize = (pw) => pw.normalize('NFC').replace(/[\u2018\u2019\u02BC\u2032]/g, "'").replace(/[\u201C\u201D]/g, '"');
  async function deriveRaw(password) {
    const P = window.PAYLOAD;
    const base = await crypto.subtle.importKey('raw', enc.encode(normalize(password)), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(P.salt), iterations: P.iterations }, base, 256);
    return new Uint8Array(bits);
  }
  async function decryptWith(raw) {
    const P = window.PAYLOAD;
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.data));
    return JSON.parse(dec.decode(plain));
  }
  const toB64 = (u8) => btoa(String.fromCharCode(...u8));

  let checkinCfg = null;
  function loadCheckin() {
    const v = $('view-checkin');
    if (!checkinCfg || v.querySelector('iframe')) return;
    v.innerHTML = '';
    const w = frame(checkinCfg.title || 'Check in', checkinCfg.src, '', 'geolocation *; camera *; microphone *; fullscreen');
    w.querySelector('iframe').dataset.noRefresh = '1';
    w.querySelector('iframe').removeAttribute('loading');
    w.querySelector('.stamp').classList.remove('stamp');
    themeToggle(w, 'checkin');
    v.append(w);
  }

  function frame(title, src, extraClass, allow) {
    const wrap = document.createElement('div');
    wrap.className = 'frame' + (extraClass ? ' ' + extraClass : '');
    const head = document.createElement('div');
    head.className = 'frame-head';
    head.innerHTML = '<span></span><span class="head-r"><span class="stamp"></span></span>';
    head.firstChild.textContent = title;
    const f = document.createElement('iframe');
    f.src = src; f.loading = 'lazy'; f.referrerPolicy = 'no-referrer';
    f.allow = allow || 'fullscreen';
    f.title = title;
    wrap.append(head, f);
    return wrap;
  }

  // ---- Dark tint for Clappia frames (revert: set DARK_FRAMES = false) ----
  // Browsers don't allow restyling another site's page, so this tints the whole
  // frame: light becomes dark, colors keep roughly their hue. Each viewer can flip
  // it per frame; their choice is remembered on that device.
  const DARK_FRAMES = true;
  function themeToggle(wrap, key) {
    if (!DARK_FRAMES) return;
    const pref = 'frame-theme-' + key;
    const get = () => { try { return localStorage.getItem(pref); } catch { return null; } };
    const set = (v) => { try { localStorage.setItem(pref, v); } catch {} };
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'theme-btn';
    const apply = (dark) => {
      wrap.classList.toggle('tinted', dark);
      btn.textContent = dark ? 'Light' : 'Dark';
      btn.setAttribute('aria-label', dark ? 'Show in light colors' : 'Show in dark colors');
      btn.title = dark ? 'Switch this frame back to Clappia’s light colors' : 'Switch this frame to dark colors';
    };
    apply(get() !== 'light');
    btn.addEventListener('click', () => { const dark = !wrap.classList.contains('tinted'); set(dark ? 'dark' : 'light'); apply(dark); });
    wrap.querySelector('.head-r').prepend(btn);
  }

  function render(cfg) {
    $('title').textContent = cfg.title || 'Check-In Board';
    document.title = $('title').textContent + ' · Hotties';
    const log = $('view-log'); log.innerHTML = '';
    if (cfg.log) { const lw = frame(cfg.log.title || 'Check-in log', cfg.log.src); themeToggle(lw, 'log'); log.append(lw); }
    else log.innerHTML = '<div class="frame empty">No check-in log has been added yet.</div>';

    const grid = $('charts'); grid.innerHTML = '';
    (cfg.charts || []).forEach((c) => grid.append(frame(c.title || 'Chart', c.src, c.wide ? 'wide' : '')));
    if (cfg.sheet && window.Analytics) window.Analytics.start(cfg.sheet.csv, grid, cfg.sheet.aliases);
    else if (!(cfg.charts || []).length) grid.innerHTML = '<div class="frame empty wide">Analytics are coming soon.</div>';

    checkinCfg = cfg.app || null;
    $('tab-checkin').hidden = !checkinCfg;
    $('view-checkin').innerHTML = '';

    stamp();
    clearInterval(refreshTimer);
    const secs = Number(cfg.refreshSeconds) || 0;
    if (secs >= 15) refreshTimer = setInterval(reloadAll, secs * 1000);

    $('lock').style.display = 'none';
    $('app').classList.add('on');
  }

  function stamp() {
    const t = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    document.querySelectorAll('.stamp').forEach(s => s.textContent = 'Updated ' + t);
  }
  function reloadAll() {
    if (document.hidden) return;
    // Never reload the check-in form: it would wipe a half-filled submission
    document.querySelectorAll('#app iframe:not([data-no-refresh])').forEach(f => { const s = f.src; f.src = 'about:blank'; f.src = s; });
    if (window.Analytics) window.Analytics.refresh();
    stamp();
  }

  $('lockForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('err').textContent = ''; $('go').disabled = true; $('goLbl').textContent = 'Unlocking…';
    try {
      const raw = await deriveRaw($('pw').value);
      const cfg = await decryptWith(raw);
      store.set(toB64(raw), $('remember').checked);
      $('pw').value = '';
      render(cfg);
    } catch {
      $('err').textContent = 'That password isn’t right.';
    } finally {
      $('go').disabled = false; $('goLbl').innerHTML = 'Unlock &rarr;';
    }
  });

  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === t));
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'view-' + t.dataset.view));
    if (t.dataset.view === 'checkin') loadCheckin();
  }));
  $('refresh').addEventListener('click', reloadAll);
  $('logout').addEventListener('click', () => { store.clear(); location.reload(); });

  // Resume a saved session
  const saved = store.get();
  if (saved && window.PAYLOAD) {
    decryptWith(b64(saved)).then(render).catch(() => store.clear());
  }
  if (!window.PAYLOAD) {
    $('err').textContent = 'This board hasn’t been set up yet.';
  }
})();
</script>
</body>
</html>
