<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Check-In Board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e8457a'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f4f5;
    --panel: #ffffff;
    --ink: #1d1a1c;
    --muted: #6f6a6d;
    --line: #e6e1e4;
    --accent: #d6336c;
    --accent-ink: #ffffff;
    --live: #1f9d55;
    --shadow: 0 1px 2px rgba(20, 10, 15, .06), 0 4px 16px rgba(20, 10, 15, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141214; --panel: #1d1a1d; --ink: #f2eef0; --muted: #a39ca0;
      --line: #2e292d; --accent: #f06595; --accent-ink: #1a0f14; --live: #3ccf7f;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }

  /* ---------- lock screen ---------- */
  #lock {
    min-height: 100%; display: grid; place-items: center; padding: 24px 16px;
  }
  .lock-card {
    width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 28px 24px; box-shadow: var(--shadow);
  }
  .mark {
    width: 44px; height: 44px; border-radius: 12px; background: var(--accent);
    display: grid; place-items: center; margin-bottom: 16px;
  }
  .lock-card h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.01em; }
  .lock-card p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  .field { position: relative; }
  .lock-card input[type=password] {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); outline: none; font-size: 16px;
  }
  .lock-card input[type=password]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  .remember { display: flex; align-items: center; gap: 8px; margin: 14px 0 18px; font-size: 14px; color: var(--muted); }
  .btn {
    width: 100%; padding: 12px; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); font-weight: 600;
  }
  .btn[disabled] { opacity: .6; cursor: progress; }
  .err { color: #d9363e; font-size: 14px; min-height: 20px; margin-top: 10px; }

  /* ---------- dashboard ---------- */
  #app { display: none; min-height: 100%; flex-direction: column; }
  #app.on { display: flex; }
  header {
    position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 12px 16px calc(0px) ; padding-top: max(12px, env(safe-area-inset-top));
  }
  .bar { display: flex; align-items: center; gap: 12px; max-width: 1400px; margin: 0 auto; }
  .bar h2 { font-size: 17px; margin: 0; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 0 var(--live); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--live) 60%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .spacer { flex: 1; }
  .icon-btn {
    border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 7px 11px;
    cursor: pointer; font-size: 13px; white-space: nowrap;
  }
  .tabs { display: flex; gap: 4px; max-width: 1400px; margin: 10px auto 0; }
  .tab {
    border: 0; background: none; padding: 9px 12px 11px; cursor: pointer; color: var(--muted);
    font-weight: 600; font-size: 14px; border-bottom: 2px solid transparent;
  }
  .tab[aria-selected=true] { color: var(--ink); border-color: var(--accent); }
  main { flex: 1; width: 100%; max-width: 1400px; margin: 0 auto; padding: 16px; }
  .view { display: none; }
  .view.on { display: block; }
  .frame {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    box-shadow: var(--shadow);
  }
  .frame-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 14px; }
  .frame iframe { display: block; width: 100%; border: 0; background: #fff; }
  #view-log iframe, #view-checkin iframe { height: calc(100vh - 170px); min-height: 520px; }
  .grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } .grid .wide { grid-column: 1 / -1; } }
  .grid iframe { height: 420px; }
  .grid .wide iframe { height: calc(100vh - 170px); min-height: 520px; }
  .empty { padding: 48px 16px; text-align: center; color: var(--muted); }
  .stamp { font-size: 12px; color: var(--muted); font-weight: 400; }
  @media (max-width: 520px) { .live span.lbl { display: none; } }

  /* ---------- analytics ---------- */
  .a-body { padding: 14px; }
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 700px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
  .kpi { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .kpi-n { font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi-l { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .last { margin-top: 12px; font-size: 14px; }
  .muted { color: var(--muted); }
  .list { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow: auto; }
  .list li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .list li:last-child { border-bottom: 0; }
  .a-empty { color: var(--muted); font-size: 14px; padding: 20px 4px; text-align: center; }
  .chart { width: 100%; height: auto; display: block; }
  .chart .bar { fill: color-mix(in srgb, var(--accent) 45%, transparent); }
  .chart .bar.today { fill: var(--accent); }
  .chart .bar-n { font-size: 11px; fill: var(--ink); text-anchor: middle; font-weight: 600; }
  .chart .bar-l { font-size: 10px; fill: var(--muted); text-anchor: middle; }
  #a-map { height: 360px; border-radius: 10px; overflow: hidden; z-index: 0; }
  .hbar { display: grid; grid-template-columns: minmax(70px, 160px) 1fr 32px; gap: 10px; align-items: center; padding: 5px 0; font-size: 14px; }
  .hbar-l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar-t { height: 10px; background: var(--bg); border-radius: 6px; overflow: hidden; }
  .hbar-f { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
  .hbar-n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
</style>
</head>
<body>

<section id="lock">
  <form class="lock-card" id="lockForm" autocomplete="on">
    <div class="mark" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    </div>
    <h1>Staff only</h1>
    <p>Enter the management password to view check-in logs and analytics.</p>
    <input type="text" name="username" value="staff" autocomplete="username" hidden>
    <div class="field"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" required autofocus></div>
    <label class="remember"><input type="checkbox" id="remember"> Keep me signed in on this device</label>
    <button class="btn" id="go" type="submit">Unlock</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</section>

<div id="app">
  <header>
    <div class="bar">
      <h2 id="title">Check-In Board</h2>
      <span class="live" title="Embedded views update as new check-ins arrive"><span class="dot"></span><span class="lbl">Live</span></span>
      <div class="spacer"></div>
      <button class="icon-btn" id="refresh" type="button">Refresh</button>
      <button class="icon-btn" id="logout" type="button">Lock</button>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="log" aria-selected="true">Check-in log</button>
      <button class="tab" role="tab" data-view="analytics" aria-selected="false">Analytics</button>
      <button class="tab" role="tab" data-view="checkin" aria-selected="false" id="tab-checkin" hidden>Check in</button>
    </nav>
  </header>
  <main>
    <section class="view on" id="view-log"></section>
    <section class="view" id="view-analytics"><div class="grid" id="charts"></div></section>
    <section class="view" id="view-checkin"></section>
  </main>
</div>

<script src="payload.js"></script>
<script src="analytics.js"></script>
<script>
(() => {
  const KEY = 'checkin-board-key';
  const $ = (id) => document.getElementById(id);
  const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const enc = new TextEncoder(), dec = new TextDecoder();
  let refreshTimer = null;

  const store = {
    get() { try { return localStorage.getItem(KEY) || sessionStorage.getItem(KEY); } catch { return null; } },
    set(v, keep) { try { (keep ? localStorage : sessionStorage).setItem(KEY, v); } catch {} },
    clear() { try { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); } catch {} }
  };

  // Curly quotes (iPhone smart punctuation) count the same as straight ones
  const normalize = (pw) => pw.normalize('NFC').replace(/[\u2018\u2019\u02BC\u2032]/g, "'").replace(/[\u201C\u201D]/g, '"');
  async function deriveRaw(password) {
    const P = window.PAYLOAD;
    const base = await crypto.subtle.importKey('raw', enc.encode(normalize(password)), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(P.salt), iterations: P.iterations }, base, 256);
    return new Uint8Array(bits);
  }
  async function decryptWith(raw) {
    const P = window.PAYLOAD;
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.data));
    return JSON.parse(dec.decode(plain));
  }
  const toB64 = (u8) => btoa(String.fromCharCode(...u8));

  let checkinCfg = null;
  function loadCheckin() {
    const v = $('view-checkin');
    if (!checkinCfg || v.querySelector('iframe')) return;
    v.innerHTML = '';
    const w = frame(checkinCfg.title || 'Check in', checkinCfg.src, '', 'geolocation *; camera *; microphone *; fullscreen');
    w.querySelector('iframe').dataset.noRefresh = '1';
    w.querySelector('iframe').removeAttribute('loading');
    w.querySelector('.stamp').classList.remove('stamp');
    v.append(w);
  }

  function frame(title, src, extraClass, allow) {
    const wrap = document.createElement('div');
    wrap.className = 'frame' + (extraClass ? ' ' + extraClass : '');
    const head = document.createElement('div');
    head.className = 'frame-head';
    head.innerHTML = '<span></span><span class="stamp"></span>';
    head.firstChild.textContent = title;
    const f = document.createElement('iframe');
    f.src = src; f.loading = 'lazy'; f.referrerPolicy = 'no-referrer';
    f.allow = allow || 'fullscreen';
    f.title = title;
    wrap.append(head, f);
    return wrap;
  }

  function render(cfg) {
    document.title = cfg.title || 'Check-In Board';
    $('title').textContent = cfg.title || 'Check-In Board';
    const log = $('view-log'); log.innerHTML = '';
    if (cfg.log) log.append(frame(cfg.log.title || 'Check-in log', cfg.log.src));
    else log.innerHTML = '<div class="frame empty">No check-in log has been added yet.</div>';

    const grid = $('charts'); grid.innerHTML = '';
    (cfg.charts || []).forEach((c) => grid.append(frame(c.title || 'Chart', c.src, c.wide ? 'wide' : '')));
    if (cfg.sheet && window.Analytics) window.Analytics.start(cfg.sheet.csv, grid);
    else if (!(cfg.charts || []).length) grid.innerHTML = '<div class="frame empty wide">Analytics are coming soon.</div>';

    checkinCfg = cfg.app || null;
    $('tab-checkin').hidden = !checkinCfg;
    $('view-checkin').innerHTML = '';

    stamp();
    clearInterval(refreshTimer);
    const secs = Number(cfg.refreshSeconds) || 0;
    if (secs >= 15) refreshTimer = setInterval(reloadAll, secs * 1000);

    $('lock').style.display = 'none';
    $('app').classList.add('on');
  }

  function stamp() {
    const t = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    document.querySelectorAll('.stamp').forEach(s => s.textContent = 'Updated ' + t);
  }
  function reloadAll() {
    if (document.hidden) return;
    // Never reload the check-in form: it would wipe a half-filled submission
    document.querySelectorAll('#app iframe:not([data-no-refresh])').forEach(f => { const s = f.src; f.src = 'about:blank'; f.src = s; });
    if (window.Analytics) window.Analytics.refresh();
    stamp();
  }

  $('lockForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('err').textContent = ''; $('go').disabled = true; $('go').textContent = 'Unlocking…';
    try {
      const raw = await deriveRaw($('pw').value);
      const cfg = await decryptWith(raw);
      store.set(toB64(raw), $('remember').checked);
      $('pw').value = '';
      render(cfg);
    } catch {
      $('err').textContent = 'That password isn’t right.';
    } finally {
      $('go').disabled = false; $('go').textContent = 'Unlock';
    }
  });

  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === t));
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'view-' + t.dataset.view));
    if (t.dataset.view === 'checkin') loadCheckin();
  }));
  $('refresh').addEventListener('click', reloadAll);
  $('logout').addEventListener('click', () => { store.clear(); location.reload(); });

  // Resume a saved session
  const saved = store.get();
  if (saved && window.PAYLOAD) {
    decryptWith(b64(saved)).then(render).catch(() => store.clear());
  }
  if (!window.PAYLOAD) {
    $('err').textContent = 'This board hasn’t been set up yet.';
  }
})();
</script>
</body>
</html>
